<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6efe3">
<title>我的店</title>
<link rel="stylesheet" href="./fonts/maoken/result.css">
<script type="importmap">{"imports":{"three":"./vendor/three@0.170.0/build/three.module.min.js","three/addons/":"./vendor/three@0.170.0/examples/jsm/"}}</script>
<style>
/* 店里面：店能走进去，展示柜放厨房做的吃的，第二天看卖得怎么样 */
:root{--paper:#f6efe3;--ink:#5b4a44;--soft:#a8968c;--red:#a8172c;--brick:#9f3726;--card:rgba(255,252,246,.94)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body,html{height:100%;background:var(--paper);overflow:hidden}
body{color:var(--ink);font:13px/1.7 "MaoKenTangYuan (beta)",-apple-system,"PingFang SC",sans-serif;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;background:0 0;cursor:pointer}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:fixed;left:0;right:0;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 12px) 16px 8px;pointer-events:none}
#hud h1{font-size:16px;font-weight:400;letter-spacing:.2em;flex:1}
#hud .pill{pointer-events:auto;padding:6px 14px;border-radius:20px;background:var(--card);font-size:12px;box-shadow:0 4px 14px -8px rgba(80,50,40,.35),0 0 0 .5px rgba(90,60,50,.12)}
#coins{letter-spacing:.08em}
#coins b{font-weight:400;color:var(--brick)}
#bar{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 16px);z-index:5;display:flex;justify-content:center;gap:10px;pointer-events:none}
.go{pointer-events:auto;padding:9px 24px;border-radius:20px;background:var(--ink);color:var(--paper);font-size:14px;letter-spacing:.3em;text-indent:.3em;transition:opacity .2s}
.go.ghost{background:var(--card);color:var(--ink);box-shadow:0 4px 14px -8px rgba(80,50,40,.35),0 0 0 .5px rgba(90,60,50,.12)}
.go:disabled{opacity:.3}
#hint{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top) + 50px);text-align:center;font-size:11px;letter-spacing:.12em;color:var(--soft);z-index:4;pointer-events:none}
.sheet{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 70px);transform:translateX(-50%) rotate(-.6deg);z-index:8;width:calc(100% - 32px);max-width:360px;background:var(--card);border-radius:18px;padding:16px 18px 14px;box-shadow:0 14px 40px -16px rgba(80,50,40,.45),0 0 0 .5px rgba(90,60,50,.15)}
.sheet[hidden]{display:none}
.sheet h3{font-size:15px;font-weight:400;letter-spacing:.12em;margin-bottom:4px}
.sheet .meta{font-size:11px;color:var(--soft);letter-spacing:.08em}
.sheet p{font-size:14px;line-height:1.8;margin:6px 0}
.sheet .x{position:absolute;right:12px;top:8px;font-size:18px;color:var(--soft)}
.sheet ul{list-style:none;padding:0;margin:8px 0;font-size:13px;line-height:1.9}
.sheet li{display:flex;justify-content:space-between;gap:8px;border-bottom:.5px dashed rgba(90,60,50,.2)}
.sheet li b{font-weight:400;color:var(--brick);white-space:nowrap}
.sheet .sum{display:flex;justify-content:space-between;margin-top:6px;font-size:14px}
.sheet .sum b{font-weight:400;color:var(--brick)}
#note{transform:translateX(-50%) rotate(1.2deg);background:#fbf3df}
#note p{font-size:15px}
#note .sign{text-align:right;font-size:12px;color:var(--soft)}
#pcBig img{display:block;width:100%;border-radius:8px}
#tags{position:fixed;inset:0;z-index:3;pointer-events:none}
.tag{position:absolute;left:0;top:0;padding:0 6px 0 4px;border-radius:8px;background:rgba(255,253,248,.95);color:var(--brick);font-size:11px;line-height:1.55;display:flex;align-items:center;gap:3px;white-space:nowrap;box-shadow:0 2px 6px -3px rgba(80,50,40,.4),0 0 0 .5px rgba(159,55,38,.35)}
.tag i{display:block;width:7px;height:7px;border-radius:50%;background:#e98aa4;box-shadow:inset 0 0 0 1.5px #f2c14e}
#veil{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:var(--paper);font-size:13px;letter-spacing:.3em;transition:opacity .6s}
#veil.out{opacity:0;pointer-events:none}
</style></head><body>
<canvas id="cv"></canvas>
<div id="tags"></div>
<div id="veil">开 门 中</div>
<div id="hud"><h1>我的店</h1><span class="pill" id="coins">花币 <b>0</b></span><a class="pill" href="./?home" style="text-decoration:none;color:inherit">回花园</a></div>
<div id="hint">拖动转着看 · 点柜子里的吃的、软木板上的明信片、门边的信箱</div>
<div id="bar"><button class="go ghost" id="restock">补 货</button><button class="go" id="close">打 烊 结 算</button></div>

<div class="sheet" id="dish" hidden><button class="x" data-close>×</button><h3 id="dName"></h3><div class="meta" id="dMeta"></div><p id="dAbout"></p></div>
<div class="sheet" id="bill" hidden><button class="x" data-close>×</button><h3>今天的账</h3><div class="meta" id="bDate"></div><ul id="bList"></ul><div class="sum"><span id="bLeft"></span><span>进账 <b id="bSum"></b></span></div></div>
<div class="sheet" id="note" hidden><button class="x" data-close>×</button><div class="meta">信箱里有一张纸条</div><p id="nTxt"></p><div class="sign" id="nSign"></div></div>
<div class="sheet" id="pcBig" hidden><button class="x" data-close>×</button><img id="pcImg" alt=""><div class="meta" id="pcMeta" style="margin-top:6px"></div></div>

<script type="module" src="./shop-in.js"></script>
</body></html>
